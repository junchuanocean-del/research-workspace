// ===== Utilities =====
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtTime(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function todayStr(){return fmtDate(new Date())}
function tomorrowStr(){return fmtDate(addDays(new Date(),1))}
function parseDate(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d}
function daysUntil(ds){const d=parseDate(ds);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function isOverdue(todo){return!todo.completed&&todo.deadline&&daysUntil(todo.deadline)<0}
function getWeekStart(){const n=new Date(),d=n.getDay()||7;const m=new Date(n);m.setDate(n.getDate()-d+1);m.setHours(0,0,0,0);return m}
function getWeekEnd(){const e=new Date(getWeekStart());e.setDate(e.getDate()+6);e.setHours(23,59,59,999);return e}
function isThisWeek(s){if(!s)return false;const d=parseDate(s);return d&&d>=getWeekStart()&&d<=getWeekEnd()}
function getDayOfYear(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000)}
function escapeHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function getStageIndex(k){return PAPER_STAGES.findIndex(s=>s.key===k)}
function getStageInfo(k){return PAPER_STAGES.find(s=>s.key===k)||PAPER_STAGES[0]}
function actLabel(v){const a=ACTIVITY_TYPES.find(t=>t.value===v);return a?a.label:v}
function actColor(v){const a=ACTIVITY_TYPES.find(t=>t.value===v);return a?a.color:'#64748b'}

// ===== Storage (multi-layer: localStorage + IndexedDB fallback) =====
const IDB_NAME='wb_research_db';
const IDB_STORE='kv';
let storageOK=false;       // true if at least one storage backend works
let storageType='none';    // 'localStorage' | 'indexedDB' | 'none'
let saveTimer=null;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(IDB_NAME,1);
      req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};
      req.onsuccess=e=>resolve(e.target.result);
      req.onerror=e=>reject(e.target.error);
    }catch(e){reject(e)}
  });
}
async function idbGet(key){
  try{const db=await idbOpen();return await new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readonly');const req=tx.objectStore(IDB_STORE).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}catch(e){return null}
}
async function idbSet(key,val){
  try{const db=await idbOpen();return await new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(val,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}catch(e){return false}
}

// Save — writes to localStorage AND IndexedDB (dual write)
function saveState(){
  // 静默模式（__csSilent 由云同步模块设置）：应用云端数据时不更新时间戳、不触发云推送
  if(!window.__csSilent){
    state.updatedAt=Date.now();
    // 用户真实编辑后，数据即视为「真实数据」，清除示例标记，避免示例数据污染云端
    if(state.settings){ state.settings.isSample=false; }
  }
  const data=JSON.stringify(state);
  let lsOK=false;
  try{localStorage.setItem(STORAGE_KEY,data);lsOK=true;storageType='localStorage';storageOK=true}catch(e){}
  // Always also write to IndexedDB (independent partition in some browsers)
  idbSet(STORAGE_KEY,data).then(ok=>{if(ok){if(!lsOK){storageType='indexedDB';storageOK=true}updateSyncBadge()}}).catch(()=>{});
  if(!lsOK){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      if(!storageOK){
        showToast('⚠️ 浏览器存储受限，请点击「导出备份」保存数据','error');
        updateSyncBadge();
      }
    },500);
  }
  updateSyncBadge();
}

// Load best (newest) state across both backends, prefer newer updatedAt
async function loadBestState(){
  let best=null,bestTs=-1,src='none';
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){const d=JSON.parse(s);const ts=d.updatedAt||0;if(ts>bestTs){best=d;bestTs=ts;src='localStorage'}}
  }catch(e){}
  try{

// ===== Charts =====
function pieChart(data,colors){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return '<div style="text-align:center;color:var(--muted);padding:20px">暂无数据</div>';
  const r=60,cx=70,cy=70;let angle=-90,paths='';
  data.forEach((d,i)=>{
    if(d.value===0)return;
    const sweep=d.value/total*360;
    const sA=angle*Math.PI/180,eA=(angle+sweep)*Math.PI/180;
    const x1=cx+r*Math.cos(sA),y1=cy+r*Math.sin(sA);
    const x2=cx+r*Math.cos(eA),y2=cy+r*Math.sin(eA);
    const large=sweep>180?1:0;
    paths+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+large+',1 '+x2+','+y2+' Z" fill="'+colors[i]+'"/>';
    angle+=sweep;
  });
  const labels=data.map((d,i)=>'<div style="display:flex;align-items:center;gap:4px;font-size:12px;margin:2px 0"><span style="width:10px;height:10px;border-radius:2px;background:'+colors[i]+';display:inline-block"></span>'+d.label+': '+d.value+'</div>').join('');
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">'+paths+'<circle cx="'+cx+'" cy="'+cy+'" r="32" fill="#fff"/><text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">'+total+'</text><text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" fill="#64748b">总计</text></svg><div>'+labels+'</div></div>';
}
function barChart(data){
  if(!data.length||data.every(d=>d.value===0))return '<div style="text-align:center;color:var(--muted);padding:20px">暂无数据</div>';
  const max=Math.max(...data.map(d=>d.value),1);
  const bw=50,gap=16,chartH=120;
  const bars=data.map((d,i)=>{
    const h=d.value/max*chartH;const x=i*(bw+gap)+gap;
    return '<rect x="'+x+'" y="'+(chartH-h+10)+'" width="'+bw+'" height="'+h+'" fill="'+(d.color||'#0d9488')+'" rx="4"/><text x="'+(x+bw/2)+'" y="'+(chartH-h+5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">'+d.value+'</text><text x="'+(x+bw/2)+'" y="'+(chartH+28)+'" text-anchor="middle" font-size="10" fill="#64748b">'+d.label+'</text>';
  }).join('');
  const w=data.length*(bw+gap)+gap;
  return '<svg width="'+w+'" height="'+(chartH+40)+'" viewBox="0 0 '+w+' '+(chartH+40)+'">'+bars+'</svg>';
}
function progressRing(percent,size,stroke,color){
  const r=(size-stroke)/2,cx=size/2,cy=size/2;
  const circ=2*Math.PI*r,offset=circ*(1-percent/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#e2e8f0" stroke-width="'+stroke+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(color||'#0d9488')+'" stroke-width="'+stroke+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" stroke-linecap="round" transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dashoffset .5s"/><text x="'+cx+'" y="'+(cy+1)+'" text-anchor="middle" dominant-baseline="middle" font-size="'+(size*0.22)+'" font-weight="700" fill="#1e293b">'+percent+'%</text></svg>';
}
function heatmap(data){
  const weeks=8,cells=[];
  for(let w=0;w<weeks;w++){for(let d=0;d<7;d++){
    const date=fmtDate(addDays(new Date(),-(weeks-w-1)*7-(6-d)));
    const entry=data.find(f=>f.date===date);
    let level=0;if(entry)level=Math.min(4,Math.ceil(entry.duration/15));
    cells.push('<div class="heatmap-cell '+(level>0?'l'+level:'')+'" title="'+date+(entry?': '+entry.items.join(', '):'')+'"></div>');
  }}
  return '<div style="display:flex;gap:3px;flex-wrap:wrap">'+cells.join('')+'</div><div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:4px"><span>少</span><div class="heatmap-cell"></div><div class="heatmap-cell l1"></div><div class="heatmap-cell l2"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div><span>多</span></div>';
}
function timerCircle(remaining,total,mode){
  const percent=remaining/total;
  const size=200,stroke=12,r=(size-stroke)/2;
  const circ=2*Math.PI*r,offset=circ*(1-percent);
  const color=mode==='work'?'#0d9488':'#22c55e';
  const mins=Math.floor(remaining/60),secs=remaining%60;
  const tt=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');

function renderTodoItem(t){
  const ov=isOverdue(t);const proj=t.projectId?state.projects.find(p=>p.id===t.projectId):null;
  const days=daysUntil(t.deadline);let dl='';
  if(t.deadline){if(days<0)dl='逾期'+Math.abs(days)+'天';else if(days===0)dl='今天';else if(days===1)dl='明天';else dl=t.deadline}
  let sh='';
  if(t.subtasks&&t.subtasks.length>0){
    const dn=t.subtasks.filter(s=>s.done).length;
    sh='<div class="subtask-list"><div style="font-size:11px;color:var(--muted);margin-bottom:2px">子任务 '+dn+'/'+t.subtasks.length+'</div>'+t.subtasks.map(s=>'<div class="subtask-item"><div class="todo-checkbox '+(s.done?'checked':'')+'" onclick="event.stopPropagation();toggleSubtask(\''+t.id+'\',\''+s.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div><span class="'+(s.done?'done-text':'')+'">'+escapeHtml(s.text)+'</span></div>').join('')+'</div>';
  }
  return '<div class="todo-item '+(ov?'overdue':'')+(t.completed?' done':'')+'"><div class="todo-checkbox '+(t.completed?'checked':'')+'" onclick="toggleTodo(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div><div class="todo-content"><div class="todo-title">'+escapeHtml(t.title)+'</div><div class="todo-meta"><span class="badge badge-'+t.priority.toLowerCase()+'">'+t.priority+'</span>'+(t.deadline?'<span class="badge '+(ov?'badge-overdue':'')+'">'+dl+'</span>':'')+(proj?'<span>· '+escapeHtml(proj.name)+'</span>':'')+(t.estimatedTime?'<span>⏱'+t.estimatedTime+'min</span>':'')+(t.deferCount>0?'<span style="color:var(--amber)">顺延'+t.deferCount+'次</span>':'')+'</div>'+sh+'</div><div class="todo-actions">'+(!t.completed&&ov?'<button class="btn btn-sm btn-outline" onclick="deferTodo(\''+t.id+'\')">顺延</button>':'')+'<button class="btn-ghost" onclick="deleteTodo(\''+t.id+'\')">删除</button></div></div>';
}
function renderTodos(){
  const active=state.todos.filter(t=>!t.completed);
  const done=state.todos.filter(t=>t.completed);
  const ov=active.filter(isOverdue);
  const today=active.filter(t=>t.deadline===todayStr()&&!isOverdue(t));
  const tmr=active.filter(t=>t.deadline===tomorrowStr());

  const nd=active.filter(t=>!t.deadline);
  let h='<div class="view-header"><div><div class="view-title">待办管理</div><div class="view-subtitle">按日期分组 · 逾期标红 · 支持子任务和预估时间</div></div></div>';
  h+='<div class="card"><div class="form-row"><div class="form-group" style="flex:1;min-width:200px"><input type="text" id="todoTitle" placeholder="输入任务标题..." onkeydown="if(event.key===\'Enter\')addTodo()"></div><div class="form-group"><select id="todoPriority"><option value="P0">P0 紧急</option><option value="P1" selected>P1 重要</option><option value="P2">P2 一般</option></select></div><div class="form-group"><input type="date" id="todoDeadline" value="'+todayStr()+'"></div><div class="form-group"><select id="todoProject"><option value="">不关联项目</option>'+state.projects.map(p=>'<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>').join('')+'</select></div><div class="form-group"><input type="number" id="todoEstTime" placeholder="预估(分)" min="0" style="width:90px"></div><button class="btn btn-primary" onclick="addTodo()">添加</button></div><div class="form-row" style="margin-bottom:0"><div class="form-group" style="flex:1"><input type="text" id="todoSubtasks" placeholder="子任务（逗号分隔，可选）"></div></div></div>';
  if(ov.length)h+='<div class="date-group-header overdue-header">逾期未完成 ('+ov.length+')</div>'+ov.map(renderTodoItem).join('');
  if(today.length)h+='<div class="date-group-header">今天 ('+today.length+')</div>'+today.map(renderTodoItem).join('');
  if(tmr.length)h+='<div class="date-group-header">明天 ('+tmr.length+')</div>'+tmr.map(renderTodoItem).join('');
  if(fut.length)h+='<div class="date-group-header">未来 ('+fut.length+')</div>'+fut.map(renderTodoItem).join('');
  if(nd.length)h+='<div class="date-group-header">无截止日期 ('+nd.length+')</div>'+nd.map(renderTodoItem).join('');
  if(done.length){h+='<div class="date-group-header">已完成 ('+done.length+')</div>';done.slice(-10).reverse().map(renderTodoItem).forEach(t=>h+=t);if(done.length>10)h+='<div style="text-align:center;color:var(--muted);font-size:12px;padding:8px">仅显示最近10条</div>'}
  if(!active.length&&!done.length)h+='<div class="empty-state"><p>暂无待办</p></div>';
  document.getElementById('view-todos').innerHTML=h;
}

// ===== Render: Weekly (Enhanced) =====
function renderWeekly(){
  const ws=fmtDate(getWeekStart()),we=fmtDate(getWeekEnd());
  const cw=state.todos.filter(t=>t.completed&&t.completedDate&&isThisWeek(t.completedDate));
  const pd=[
    {label:'P0',value:cw.filter(t=>t.priority==='P0').length,color:'#ef4444'},
    {label:'P1',value:cw.filter(t=>t.priority==='P1').length,color:'#f59e0b'},
    {label:'P2',value:cw.filter(t=>t.priority==='P2').length,color:'#3b82f6'}
  ];
  const weekLogs=state.timeLogs.filter(l=>isThisWeek(l.date));
  const projData=state.projects.map(p=>{
    const c=weekLogs.filter(l=>l.projectId===p.id).reduce((s,l)=>s+l.duration,0);
    return{label:p.name.length>6?p.name.slice(0,6)+'…':p.name,value:c,color:'#0d9488'};
  }).filter(d=>d.value>0);
  const actData=ACTIVITY_TYPES.map(a=>{

    return{label:a.label,value:c};
  }).filter(d=>d.value>0);
  const blockers=state.projects.filter(p=>p.blocker&&p.status==='active');
  const note=state.weeklyNotes.find(n=>n.weekStart===ws);
  const totalFocus=weekLogs.reduce((s,l)=>s+l.duration,0);
  const expCount=state.experiments.filter(e=>isThisWeek(e.date)).length;

  let h='<div class="view-header"><div><div class="view-title">每周复盘</div><div class="view-subtitle">'+ws+' ~ '+we+' · 自动统计</div></div></div>';

  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  h+='<div class="chart-container"><div class="chart-title">按优先级分布</div>'+pieChart(pd,['#ef4444','#f59e0b','#3b82f6'])+'</div>';
  h+='<div class="chart-container"><div class="chart-title">时间分布（按项目·分钟）</div>'+(projData.length?barChart(projData):'<div style="text-align:center;color:var(--muted);padding:20px">暂无数据</div>')+'</div>';
  h+='</div>';
  if(actData.length){
    h+='<div class="chart-container"><div class="chart-title">时间分布（按活动类型·分钟）</div>'+pieChart(actData,ACTIVITY_TYPES.map(a=>a.color))+'</div>';
  }
  h+='<div class="chart-container"><div class="chart-title">卡点汇总</div>'+(blockers.length?blockers.map(p=>'<div class="blocker-list-item"><span style="color:var(--red);font-weight:700">●</span><div><strong>'+escapeHtml(p.name)+'</strong>：'+escapeHtml(p.blocker)+'</div></div>').join(''):'<div style="color:var(--muted);padding:8px">本周无卡点</div>')+'</div>';
  h+='<div class="card"><div class="section-label">本周反思</div>';
  const fields=[{k:'wentWell',l:'做得好的'},{k:'didntGoWell',l:'做得不好的'},{k:'lessons',l:'经验教训'},{k:'nextWeek',l:'下周计划'}];
  fields.forEach(f=>{
    h+='<div class="form-group" style="margin-top:8px"><label>'+f.l+'</label><textarea id="wn_'+f.k+'" placeholder="'+f.l+'..." style="min-height:50px">'+(note&&note[f.k]?escapeHtml(note[f.k]):'')+'</textarea></div>';
  });
  h+='<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="saveWeeklyNote(\''+ws+'\')">保存反思</button></div>';

  const plan=FITNESS_PLAN[new Date().getDay()];
  const todayLog=state.fitness.find(f=>f.date===todayStr());
  const weekStats=state.fitness.filter(f=>isThisWeek(f.date));
  const totalMin=weekStats.reduce((s,f)=>s+f.duration,0);
  const activeDays=getActiveDays();
  let h='<div class="view-header"><div><div class="view-title">健身打卡</div><div class="view-subtitle">每周训练计划 · 打卡记录 · 热力图</div></div></div>';
  // Today's plan card
  h+='<div class="fitness-today"><div class="fitness-plan-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5l11 11M2 9v6M5 5v14M19 5v14M22 9v6"/></svg>今日计划：'+plan.title+'</div>';
  if(plan.rest){
    h+='<div style="font-size:13px;color:var(--muted);margin-bottom:8px">今天是休息日，让身体恢复一下。'+(plan.items.length>0?'<br>如果想活动一下也可以打卡：':'')+'</div>';

    // Check-in form with type selector

    h+='<input type="hidden" id="fitItems" value="'+plan.items.join('|')+'">';
  }
  h+='</div>';
  // Weekly schedule overview
  h+='<div class="card"><div class="section-label">本周训练计划</div><div style="display:flex;gap:4px;flex-wrap:wrap">';
  const dayNames=['日','一','二','三','四','五','六'];
  FITNESS_PLAN.forEach(d=>{
    const log=state.fitness.find(f=>f.date===todayStr()&&false); // not needed here
    const hasLog=weekStats.some(w=>{const wd=parseDate(w.date);return wd&&wd.getDay()===d.day});
    h+='<div style="flex:1;min-width:80px;text-align:center;padding:8px 4px;border-radius:8px;background:'+(d.rest?'var(--bg)':'#f0fdfa')+';border:1px solid '+(d.rest?'var(--border)':'#ccfbf1')+'"><div style="font-size:11px;color:var(--muted)">周'+dayNames[d.day]+'</div><div style="font-size:12px;font-weight:600;margin:2px 0;color:'+(d.rest?'var(--muted)':'var(--teal-d)')+'">'+(d.rest?'休息':fitTypeLabel(d.type))+'</div>'+(d.rest?'<div style="font-size:10px;color:var(--muted)">恢复</div>':'<div style="font-size:10px;color:var(--muted)">'+d.duration+'min</div>')+'<div style="margin-top:4px">'+(hasLog?'<span style="color:var(--green);font-size:14px">✓</span>':d.rest?'<span style="color:var(--border);font-size:14px">○</span>':'<span style="color:var(--border);font-size:14px">○</span>')+'</div></div>';
  });

function renderEnglish(){
  var doy=getDayOfYear();

  var ts=state.englishLog.length;
  var byCat={};
  ENGLISH_LESSONS.forEach(function(l){byCat[l.cat]=(byCat[l.cat]||0)+1});
  var h='<div class="view-header"><div><div class="view-title">英语学习</div><div class="view-subtitle">听说读写全面提高 · 物理海洋学 · 学术英语 · 前沿资讯 · 共'+total+'课</div></div></div>';

  h+='<div class="eng-cat-tabs"><button class="eng-cat-tab '+(englishCatFilter===null?'active':'')+'" onclick="setEnglishCat(null)">全部 ('+total+')</button>';
  ENGLISH_CATS.forEach(function(c){
    h+='<button class="eng-cat-tab '+(englishCatFilter===c.id?'active':'')+'" onclick="setEnglishCat(\''+c.id+'\')">'+c.label+' ('+(byCat[c.id]||0)+')</button>';
  });
  h+='</div>';
  if(englishCatFilter===null){
    h+=renderEnglishLessonCard(ENGLISH_LESSONS[todayIdx],todayIdx,true);
  }
  var filtered=ENGLISH_LESSONS;
  if(englishCatFilter)filtered=filtered.filter(function(l){return l.cat===englishCatFilter});
  filtered.forEach(function(lesson,i){
    var realIdx=ENGLISH_LESSONS.indexOf(lesson);

// ===== Timer =====
function tickTimer(){
  timer.remaining--;
  if(timer.remaining<=0){
    if(timer.mode==='work'){
      state.timeLogs.push({id:uid(),date:todayStr(),startTime:fmtTime(new Date()),duration:timer.workDuration,projectId:timer.projectId||null,activityType:timer.activityType});
      saveState();timer.completedSessions++;
      showToast('专注完成！休息一下','success');
      timer.mode='break';timer.remaining=timer.breakDuration*60;
    }else{
      showToast('休息结束，继续专注！','success');
      timer.mode='work';timer.remaining=timer.workDuration*60;
    }
    renderNav();
  }
  const w=document.getElementById('timerCircleWrap');
  if(w){const total=timer.mode==='work'?timer.workDuration:timer.breakDuration;w.innerHTML=timerCircle(timer.remaining,total,timer.mode)}
}
function startTimer(){
  if(timer.running)return;
  const tp=document.getElementById('timerProject');
  if(tp)timer.projectId=tp.value;
  const ta=document.getElementById('timerActivity');
  if(ta)timer.activityType=ta.value;
  timer.running=true;
  timer.intervalId=setInterval(tickTimer,1000);
  renderTimer();renderNav();
}
function pauseTimer(){timer.running=false;clearInterval(timer.intervalId);timer.intervalId=null;renderTimer();renderNav();}
function resetTimer(){timer.running=false;clearInterval(timer.intervalId);timer.intervalId=null;timer.mode='work';timer.remaining=timer.workDuration*60;renderTimer();renderNav();}
function changeWorkDur(v){timer.workDuration=parseInt(v);if(!timer.running&&timer.mode==='work')timer.remaining=timer.workDuration*60;renderTimer();}
function changeBreakDur(v){timer.breakDuration=parseInt(v);if(!timer.running&&timer.mode==='break')timer.remaining=timer.breakDuration*60;renderTimer();}

    state={todos:[],ideas:[],projects:[],papers:[],fitness:[],englishLog:[],weeklyNotes:[],literature:[],experiments:[],meetings:[],timeLogs:[],settings:{lastExportReminder:''}};

  });
}
function finishInit(){
  ['todos','ideas','projects','papers','fitness','englishLog','weeklyNotes','literature','experiments','meetings','timeLogs'].forEach(k=>{if(!state[k])state[k]=[]});
  if(!state.settings)state.settings={lastExportReminder:''};
  state.papers.forEach(p=>{if(!PAPER_STAGES.find(s=>s.key===p.stage))p.stage='concept';if(p.venue===undefined)p.venue='';if(p.coAuthors===undefined)p.coAuthors='';if(p.doi===undefined)p.doi='';});
  state.todos.forEach(t=>{if(!t.subtasks)t.subtasks=[];if(t.estimatedTime===undefined)t.estimatedTime=0;});
  state.ideas.forEach(i=>{if(!i.priority)i.priority='low';});
  timer.remaining=timer.workDuration*60;
  // Request persistent storage if available
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
  saveState(); // sync loaded data to both backends
  updateSyncBadge();
  render();
}
function init(){
  // Load newest state across localStorage + IndexedDB
  loadBestState().then(({best,src})=>{
    if(best){
      state=best;
      storageType=src;storageOK=true;
    }else{
      state=generateSampleData();
      state.updatedAt=0; // 初始示例数据时间戳置 0：标记为非权威，绝不在合并时覆盖云端真实数据
    }
    // 首次加载的本地保存：静默写入——保持示例标记与时间戳 0、且不触发云端推送，
    // 避免示例数据被盖成 now 时间戳后误覆盖云端真实数据
    window.__csSilent=true;
    saveState();
    window.__csSilent=false;
    finishInit();
  });
}
// 跨天自动刷新：标签页常开时，零点后自动切到新日期（避免误记到昨天）
(function(){
  let lastDay=todayStr();
  setInterval(function(){
    const d=todayStr();
    if(d!==lastDay){
      lastDay=d;
      const ae=document.activeElement;
      const editing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
      if(!editing){render();showToast('已进入新的一天 '+d)}
    }
  },30000);
})();
init();

    enabled: true
  };

  var app = null, auth = null, db = null, unsubscribe = null;
  var pushTimer = null;
  var deviceId = (function(){
    try{
      var k='wb_device_id';
      var v=localStorage.getItem(k);
      if(v) return v;
      v='d_'+Math.random().toString(36).slice(2)+'_'+Date.now();
      localStorage.setItem(k,v);
      return v;
    }catch(e){ return 'unknown_'+Date.now(); }
  })();

  /* ---------- 小工具 ---------- */
  function loadScript(src, cb, err){
    var s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=function(){ cb && cb(); };
    s.onerror=function(){ err && err(new Error('加载失败: '+src)); };
    document.head.appendChild(s);
  }
  function toast(msg, type){
    try{ window.showToast && window.showToast(msg, type||'info'); }catch(e){}
  }
  function callRender(){ try{ window.render && window.render(); }catch(e){} }
  /* 注意：主脚本用 let 声明 state/storageOK，不会挂到 window 上，
     必须直接访问全局词法绑定（跨 script 共享），而非 window.state */
  function getLocalState(){
    try{
      if(typeof state!=='undefined' && state) return state;
      if(typeof window.state!=='undefined' && window.state) return window.state;
    }catch(e){}
    return null;
  }
  function setLocalState(newState, silent){
    if(!newState) return;
    try{ state = newState; }catch(e){ window.state = newState; }
    try{
      if(silent){ window.__csSilent = true; }
      window.saveState && window.saveState();
      if(silent){ delete window.__csSilent; }
    }catch(e){ if(silent){ try{ delete window.__csSilent; }catch(_){} } }
  }
  function backupLocal(local){
    if(!local) return;
    try{
      var arr=JSON.parse(localStorage.getItem('wb_research_workspace_backups')||'[]');
      arr.unshift({at:Date.now(), data:local});
      arr=arr.slice(0,5);
      localStorage.setItem('wb_research_workspace_backups', JSON.stringify(arr));
    }catch(e){}
  }
  function setBadge(type){
    try{
      var dot=document.getElementById('syncDot'), txt=document.getElementById('syncText');
      if(!dot || !txt) return;
      dot.className='sync-dot';
      if(type==='cloud'){ dot.classList.add('cloud'); txt.textContent='已云同步'; }
      else if(type==='loading'){ dot.classList.add('loading'); txt.textContent='同步中…'; }
      else if(type==='error'){ dot.classList.add('error'); txt.textContent='同步失败'; }
      else if(type==='local'){ txt.textContent='本地模式'; }
      else { txt.textContent='检测中'; }
    }catch(e){}
  }

  /* ---------- Firebase 初始化 ---------- */
  function start(){
    if(!self.enabled) return;
    if(self.status==='loading' || self.status==='synced') return;
    self.status='loading';
    setBadge('loading');

    if(typeof window.firebase !== 'undefined'){
      initApp();
    } else {
      var sdkUrl='https://www.gstatic.com/firebasejs/10.12.2/firebase-compat.js';
      loadScript(sdkUrl, initApp, function(e){
        self.status='error';
        setBadge('error');
        toast('Firebase SDK 加载失败，请检查网络能否访问 Google','error');
      });
    }
  }

  function initApp(){
    try{
      if(!firebase.apps.length){
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      app = firebase.app();
      auth = firebase.auth();
      db = firebase.firestore();
    }catch(e){
      self.status='error'; setBadge('error');
      toast('Firebase 初始化失败：'+e.message,'error');
      return;
    }
    signIn();
  }

  function signIn(){
    if(!auth){ self.status='error'; setBadge('error'); return; }
    auth.signInAnonymously().then(function(cred){
      self.authed = true; self.status='synced'; setBadge('cloud');
      pullAndMerge();
      startWatch();
    }).catch(function(err){
      self.status='error'; setBadge('error');
      var msg = err.message || '';
      if(msg.indexOf('administrator')>-1 || err.code==='auth/admin-restricted-operation' || err.code==='auth/operation-not-allowed'){
        toast('请在 Firebase 控制台开启「匿名登录(Anonymous)」','error');
      } else {
        toast('Firebase 登录失败：'+msg,'error');
      }
    });
  }

  /* ---------- 数据同步 ---------- */
  function pullAndMerge(){
    if(!db || !self.authed) return;
    var local = getLocalState();
    var localIsSample = !!(local && local.settings && local.settings.isSample);
    db.collection('sync_states').doc('main').get().then(function(doc){
      if(!doc.exists){
        // 云端为空：仅当本地已是真实数据时才上传；示例数据不抢占云端（保持为空，等待真实数据）
        if(!localIsSample) pushNow();
        return;
      }
      var d = doc.data() || {};
      if(!d.updatedAt){ if(!localIsSample) pushNow(); return; }
      var cloudData = null;
      try{ cloudData = JSON.parse(d.data); }catch(e){}
      if(!cloudData){ if(!localIsSample) pushNow(); return; }
      var cloudIsSample = !!(cloudData.settings && cloudData.settings.isSample);
      // 恢复：云端是示例、本地是真实 → 用本地真实数据覆盖云端
      if(cloudIsSample && !localIsSample){
        backupLocal(local);
        pushNow();
        toast('检测到云端为示例数据，已用本地真实数据覆盖');
        return;
      }
      // 云端是真实、本地是示例 → 直接采用云端真实数据（不再把示例推上去）
      if(!cloudIsSample && localIsSample){
        backupLocal(local);
        setLocalState(cloudData, true);
        callRender();
        self.lastSyncAt = Date.now();
        self.lastPushTs = cloudData.updatedAt || 0;
        self.lastPushBy = d.by || '';
        toast('已从云端拉取最新数据');
        return;
      }
      var ct = cloudData.updatedAt || 0;
      var lt = local && local.updatedAt || 0;
      if(ct > lt){
        backupLocal(local);
        setLocalState(cloudData, true);
        callRender();
        self.lastSyncAt = Date.now();
        self.lastPushTs = cloudData.updatedAt || 0;
        self.lastPushBy = d.by || '';
        toast('已从云端拉取最新数据');
      } else if(lt > ct){
        pushNow();
      } else {
        self.lastSyncAt = Date.now();
      }
    }).catch(function(e){
      setBadge('error');
      var msg = e.message || '';
      if(msg.indexOf('Missing or insufficient permissions')>-1 || e.code==='permission-denied'){
        toast('Firestore 权限不足，请检查数据库规则','error');
      } else if(msg.indexOf('database was not found')>-1 || msg.indexOf('does not exist')>-1){
        toast('请先创建 Firestore Database','error');
      } else {
        toast('拉取失败：'+msg,'error');
      }
    });
  }

  function _doPush(s){
    if(!db || !self.authed) return;
    var payload = {
      data: JSON.stringify(s),
      updatedAt: s.updatedAt || Date.now(),
      by: deviceId
    };
    self.lastPushTs = payload.updatedAt;
    self.lastPushBy = deviceId;
    db.collection('sync_states').doc('main').set(payload).then(function(){
      self.lastSyncAt = Date.now();
      setBadge('cloud');
    }).catch(function(e){
      setBadge('error');
      var msg = e.message || '';
      if(msg.indexOf('Missing or insufficient permissions')>-1 || e.code==='permission-denied'){
        toast('同步失败：Firestore 规则未开放','error');
      } else {
        toast('同步失败：'+msg,'error');
      }
    });
  }

  function pushNow(){
    if(!db || !self.authed) return;
    var s = getLocalState();
    if(!s) return;
    // 安全护栏：绝不让「示例数据」覆盖云端已有的「真实数据」
    var localIsSample = !!(s.settings && s.settings.isSample);
    if(localIsSample){
      // 先读云端：仅当云端为空或为示例数据时，才允许上传示例；否则跳过，避免污染真实数据
      db.collection('sync_states').doc('main').get().then(function(doc){
        if(doc.exists){
          var cd=null; try{ cd=JSON.parse((doc.data()||{}).data||'null'); }catch(e){}
          var cloudReal = !(cd && cd.settings && cd.settings.isSample);
          if(cloudReal){
            toast('云端已有真实数据，已跳过本次示例数据上传','info');
            return;
          }
        }
        _doPush(s);
      }).catch(function(){ _doPush(s); });
      return;
    }
    _doPush(s);
  }

  function onLocalSave(){
    if(!self.enabled || !self.authed) return;
    if(pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){ pushNow(); }, 1500);
  }

  function startWatch(){
    if(!db) return;
    if(unsubscribe){ unsubscribe(); unsubscribe=null; }
    unsubscribe = db.collection('sync_states').doc('main').onSnapshot(function(doc){
      if(!doc.exists) return;
      var d = doc.data() || {};
      if(!d.updatedAt) return;
      var remoteTs = d.updatedAt || 0;
      // 回声防护：忽略自己刚推送的变更
      if(d.by === deviceId && remoteTs <= self.lastPushTs + 1000) return;
      var local = getLocalState();
      if(remoteTs > (local && local.updatedAt || 0)){
        var remote = null;
        try{ remote = JSON.parse(d.data); }catch(e){}
        if(remote){
          backupLocal(local);
          setLocalState(remote, true);
          callRender();
          self.lastSyncAt = Date.now();
          toast('检测到其他设备更新，已同步');
        }
      }
    }, function(e){
      // watch 失败不影响主流程
    });
  }

  function syncNow(){ pullAndMerge(); pushNow(); }

  /* ---------- 面板 UI ---------- */
  function buildPanel(){
    var div = document.createElement('div');
    div.id = 'cloudSyncPanel';
    div.className = 'cloud-sync-panel';
    div.innerHTML = [
      '<div class="csp-header"><h3>☁️ 云同步（Firebase）</h3><button class="csp-close" title="关闭">&times;</button></div>',
      '<div class="csp-body">',
        '<div class="csp-status">状态：<span id="cspStatus">'+(self.authed?'已连接':'初始化中…')+'</span></div>',
        '<p class="csp-hint">配置已内置。只要 Firebase 控制台开启了匿名登录和 Firestore，打开页面即自动同步。</p>',
        '<div class="csp-actions">',
          '<button id="cspSyncNow" class="csp-btn primary">立即同步</button>',
          '<button id="cspReconnect" class="csp-btn">重新连接</button>',
        '</div>',
        '<div class="csp-actions">',
          '<button id="cspForcePush" class="csp-btn" style="border-color:#f59e0b;color:#b45309">强制上传本地数据</button>',
        '</div>',
        '<div class="csp-help">',
          '<b>若同步失败请检查：</b>',
          '<ol>',
            '<li>Firebase 控制台 → Authentication → Sign-in method → Anonymous 已启用</li>',
            '<li>Firebase 控制台 → Firestore Database → 已创建数据库，规则允许读写 /sync_states/{doc}</li>',
          '</ol>',
        '</div>',
      '</div>'
    ].join('');
    document.body.appendChild(div);

    div.querySelector('.csp-close').onclick = closePanel;
    div.querySelector('#cspSyncNow').onclick = function(){ syncNow(); closePanel(); };
    div.querySelector('#cspReconnect').onclick = function(){ start(); };
    div.querySelector('#cspForcePush').onclick = function(){
      var s=getLocalState();
      if(s && s.settings && s.settings.isSample){ pushNow(); toast('当前为示例数据：云端已有真实数据时不会被覆盖','info'); }
      else { pushNow(); toast('已强制上传本地数据到云端'); }
    };

    div.addEventListener('click', function(e){ if(e.target===div) closePanel(); });
    document.addEventListener('keydown', function esc(e){ if(e.key==='Escape') closePanel(); document.removeEventListener('keydown', esc); });
  }
  function openPanel(){
    var p = document.getElementById('cloudSyncPanel');
    if(!p){ buildPanel(); p=document.getElementById('cloudSyncPanel'); }
    if(p) p.classList.add('open');
    try{
      var st=document.getElementById('cspStatus');
      if(st) st.textContent = self.authed ? '已连接' : (self.status==='error'?'连接失败':'初始化中…');
    }catch(e){}
  }
  function closePanel(){
    var p=document.getElementById('cloudSyncPanel');
    if(p) p.classList.remove('open');
  }
  function toggle(){ var p=document.getElementById('cloudSyncPanel'); if(p && p.classList.contains('open')) closePanel(); else openPanel(); }

  /* ---------- 接管本地保存 ---------- */
  var __origSave = window.saveState;
  if(typeof __origSave==='function'){
    window.saveState = function(){
      var r = __origSave.apply(this, arguments);
      // 静默保存（应用云端数据）或首次加载保存时，不触发云端推送，避免回声与示例数据覆盖
      try{ if(!window.__csSilent && !window.__csNoPush) onLocalSave(); }catch(e){}
      return r;
    };
  }

  /* ---------- 对外接口 ---------- */
  var CloudSync = {
    start: start,
    setBadge: setBadge,
    openPanel: openPanel,
    closePanel: closePanel,
    toggle: toggle,
    syncNow: syncNow,
    onLocalSave: onLocalSave,
    authed: false,
    _self: self
  };

  /* 暴露全局 */
  window.CloudSync = CloudSync;

  /* 绑定顶栏/侧栏按钮事件 */
  function bindButtons(){
    var sb=document.getElementById('syncBadge');
    if(sb && !sb._csBound){ sb._csBound=true; sb.style.cursor='pointer'; sb.onclick=function(){ toggle(); }; }
    var cb=document.getElementById('cloudSyncBtn');
    if(cb && !cb._csBound){ cb._csBound=true; cb.onclick=function(){ toggle(); }; }
  }

  /* 样式注入 */
  (function injectStyles(){
    if(document.getElementById('cs-firebase-styles')) return;
    var css = document.createElement('style');
    css.id='cs-firebase-styles';
    css.textContent = [
      '.cloud-sync-panel{position:fixed;right:-420px;top:0;width:420px;max-width:100%;height:100%;background:#fff;box-shadow:-5px 0 25px rgba(0,0,0,.15);z-index:10001;transition:right .25s;display:flex;flex-direction:column;font-size:14px}',
      '.cloud-sync-panel.open{right:0}',
      '.csp-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eee;background:#fafafa}',
      '.csp-header h3{margin:0;font-size:16px;font-weight:600;color:#333}',
      '.csp-close{background:none;border:none;font-size:22px;cursor:pointer;color:#666;line-height:1}',
      '.csp-body{padding:20px;flex:1;overflow:auto}',
      '.csp-status{margin-bottom:12px;color:#333;font-weight:500}',
      '.csp-status span{color:#22c55e}',
      '.csp-hint{color:#666;line-height:1.6;margin-bottom:16px}',
      '.csp-actions{display:flex;gap:10px;margin-bottom:20px}',
      '.csp-btn{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}',
      '.csp-btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}',
      '.csp-help{ background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:12px;color:#4b5563;font-size:12px;line-height:1.6}',
      '.csp-help ol{margin:8px 0 0 16px;padding:0}',
      '.csp-help li{margin-bottom:4px}'
    ].join('');
    document.head.appendChild(css);
  })();

  /* 页面加载后自动启动（state/storageOK 是主脚本的 let 全局绑定，不挂 window，直接按标识符访问） */
  var tries=0;
  (function waitReady(){
    var stateReady=false;
    try{ stateReady = (typeof state!=='undefined') && !!state; }catch(e){ stateReady=false; }
    if(!stateReady){ stateReady = !!(window.state); }
    var storageReady=false;
    try{ storageReady = (typeof storageOK!=='undefined'); }catch(e){ storageReady=(window.storageOK!==undefined); }
    var renderReady=false;
    try{ renderReady = (typeof render==='function') || (window.render && typeof window.render==='function'); }catch(e){}
    if(stateReady && storageReady && renderReady){
      bindButtons();
      start();
      return;
    }
    if(++tries<60){ setTimeout(waitReady, 500); }
  })();
})();
</script>
</body>
</html>
